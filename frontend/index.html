<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uptime Viewer</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <a class="project-link" href="https://github.com/DonPlafon/uptime_viewer" target="_blank" rel="noopener">UPTIME VIEWER</a>
                <h1>Service Status</h1>
            </div>
            <div class="header-controls">
                <div class="period-selector" role="group" aria-label="History period">
                    <button data-period="24" class="active" aria-pressed="true">24H</button>
                    <button data-period="168" aria-pressed="false">7D</button>
                    <button data-period="720" aria-pressed="false">30D</button>
                </div>
                <span id="updated">Waiting for data</span>
            </div>
        </header>
        <p id="refresh-error" role="status" hidden></p>
        <main id="services-container"><div class="loading-state">Loading services...</div></main>
    </div>
    <template id="service-template">
        <section class="service-card">
            <div class="service-header">
                <div class="service-title"><span class="status-indicator"></span><div><h2 class="service-name"></h2><a class="service-link" target="_blank" rel="noopener"></a></div></div>
                <span class="current-status"></span>
            </div>
            <dl class="service-metrics">
                <div><dt>Uptime</dt><dd class="uptime-percentage"></dd></div>
                <div><dt>Outages</dt><dd class="outage-count"></dd></div>
                <div><dt>Total downtime</dt><dd class="downtime-total"></dd></div>
                <div><dt>Longest outage</dt><dd class="longest-outage"></dd></div>
                <div><dt>Avg. response</dt><dd class="average-ping"></dd></div>
            </dl>
            <div class="uptime-bar-container">
                <div class="uptime-segments" aria-label="Availability history"></div>
                <div class="uptime-labels"><span class="start-label"></span><span>Now</span></div>
                <div class="segment-detail" role="status"></div>
            </div>
            <div class="chart-wrapper"><h3>Response time <span>ms</span></h3><div class="chart-container"><canvas class="ping-chart" role="img" aria-label="Average response time history"></canvas><p class="chart-empty" hidden></p></div></div>
            <details class="outage-history"><summary>Recent outages <span class="history-count"></span></summary><div class="outage-list"></div></details>
        </section>
    </template>
    <script type="module" src="/js/main.js"></script>
</body>
</html>
